[project]
name = "ai-governance"
version = "0.1.0"
description = "AI regulatory compliance testing platform"
authors = [
    {name = "Rhishikumar", email = "rhishikumarayyappan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Phase 0 dependencies only. Heavier groups (fairlearn/shap/lime/scikit-learn,
# streamlit, reportlab, garak/ollama) are added at the start of the phase that
# first uses them. See docs/BUILD_PLAN.md.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.poetry]
packages = [
    { include = "governance" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
